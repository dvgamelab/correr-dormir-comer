<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Correr Dormir Comer</title>
<meta name="description" content="Todas las carreras de España (asfalto y trail) y un planificador de fin de semana: correr, dormir y comer.">
<meta name="theme-color" content="#F0532B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor-leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#" id="brandLink" aria-label="Inicio">
      <span class="brand-mark" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i></span>
      <span class="brand-word">correr<b>·</b>dormir<b>·</b>comer</span>
    </a>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Busca carrera, pueblo o provincia" autocomplete="off">
    </label>
    <button class="btn ghost plans-btn" id="openPlans" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <span>Mis planes</span><span class="badge" id="plansCount">0</span>
    </button>
  </header>

  <section class="filters" aria-label="Filtros">
    <div class="chip-group" role="group" aria-label="Superficie">
      <button class="chip" data-surface="road" type="button"><i class="dot road"></i>Asfalto</button>
      <button class="chip" data-surface="trail" type="button"><i class="dot trail"></i>Trail</button>
    </div>
    <div class="chip-group" role="group" aria-label="Distancia">
      <button class="chip" data-cat="5k" type="button">5K</button>
      <button class="chip" data-cat="10k" type="button">10K</button>
      <button class="chip" data-cat="21k" type="button">Media</button>
      <button class="chip" data-cat="42k" type="button">Maratón</button>
      <button class="chip" data-cat="ultra" type="button">Ultra</button>
      <button class="chip" data-cat="other" type="button">Otras</button>
    </div>
    <div class="selects">
      <select id="when" aria-label="Cuándo">
        <option value="all">Cualquier fecha</option>
        <option value="thisw">Este finde</option>
        <option value="nextw">Próximo finde</option>
        <option value="30">Próximos 30 días</option>
        <option value="90">Próximos 3 meses</option>
        <option value="custom">Elegir fechas…</option>
      </select>
      <span class="daterange" id="dateRange" hidden>
        <input type="date" id="dFrom" aria-label="Desde">
        <input type="date" id="dTo" aria-label="Hasta">
      </span>
      <select id="ccaa" aria-label="Comunidad"><option value="">Toda España</option></select>
      <span class="near">
        <input id="nearTown" list="towns" placeholder="Cerca de…" aria-label="Cerca de (pueblo o ciudad)">
        <select id="nearKm" aria-label="Radio">
          <option value="25">25 km</option><option value="50" selected>50 km</option>
          <option value="100">100 km</option><option value="200">200 km</option>
        </select>
      </span>
      <datalist id="towns"></datalist>
      <button class="link-btn" id="clearFilters" type="button">Limpiar</button>
    </div>
  </section>

  <main class="split" id="split">
    <section class="list-pane" id="listPane" aria-label="Carreras">
      <div class="list-head">
        <p class="count" id="count">Cargando carreras…</p>
        <label class="toggle"><input type="checkbox" id="mapFilter"> Filtrar por zona del mapa</label>
        <button class="chip small" id="favOnly" type="button" aria-pressed="false">♥ Favoritas</button>
      </div>
      <div id="list" class="list"></div>
      <button class="btn ghost more" id="more" type="button" hidden>Mostrar más carreras</button>
      <footer class="data-foot" id="dataFoot"></footer>
    </section>
    <section class="map-pane" aria-label="Mapa">
      <div id="map"></div>
      <div class="legend"><span><i class="dot road"></i>Asfalto</span><span><i class="dot trail"></i>Trail</span><span><i class="dot approx"></i>Ubicación aproximada</span></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Vistas">
    <button type="button" data-view="list" class="on">Lista</button>
    <button type="button" data-view="map">Mapa</button>
    <button type="button" data-view="plans">Planes</button>
  </nav>

  <aside class="sheet" id="sheet" hidden aria-live="polite"></aside>
  <section class="plan-view" id="planView" hidden></section>
  <section class="plans-view" id="plansView" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
