name: Recolectar carreras (semanal) y publicar

on:
  schedule:
    - cron: "0 4 * * 1"   # lunes 04:00 UTC (06:00 en España en verano)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Recolectar
        env:
          GEOCODE_BUDGET: "2500"
          DETAIL_BUDGET: "1500"
        run: python scraper/run.py
      - name: Guardar datos en el repo
        run: |
          git config user.name "cdc-bot"
          git config user.email "cdc-bot@users.noreply.github.com"
          git add web/data data
          git diff --cached --quiet || git commit -m "Datos semanales $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: [scrape]
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
